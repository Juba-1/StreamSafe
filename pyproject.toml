[project]
name = "streamsafe"
version = "3.0.0"
description = "Real-time covering of risky characters in game streams, before viewers see them"
requires-python = ">=3.11"  # 3.11+: precise sleep on Windows (the output clock)
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "pillow>=10"]

[project.optional-dependencies]
models = ["torch>=2.4", "transformers>=4.57", "rfdetr", "einops", "timm", "accelerate"]  # research / export
# product runtime: ONNX Runtime. The two wheels cannot be installed together: one per build
onnx-nvidia = ["onnxruntime-gpu>=1.20"]
onnx-directml = ["onnxruntime-directml>=1.20"]
# the NVIDIA product path (TRT=1): the pair run 57 measured. TensorRT's major version must be the one this
# ONNX Runtime was built for, so both are pinned; move them together (docs/NVIDIA_TRT.md)
onnx-tensorrt = ["onnxruntime-gpu==1.22.*", "tensorrt-cu12==10.9.*"]
export = ["onnx", "onnxscript"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
streamsafe = "streamsafe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["streamsafe*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "RET"]
ignore = ["E741", "N806", "C408", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
