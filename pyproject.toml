[project]
name = "streamsafe"
version = "3.0.0"
description = "Real-time covering of risky characters in game streams, before viewers see them"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "pillow>=10"]

[project.optional-dependencies]
models = ["torch>=2.4", "transformers>=4.57", "rfdetr", "einops", "timm", "accelerate"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
streamsafe = "streamsafe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["streamsafe*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "RET"]
ignore = ["E741", "N806", "C408", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
