name: tutorial-edit

# A push to the tutorial-edit branch: edits the tutorial from the Windows recording (run id in
# tools/tutorial/edit_inputs.json) and the live copy from the work store.
on:
  push:
    branches: [tutorial-edit]

permissions:
  contents: read
  actions: read

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inputs
        id: in
        run: |
          echo "run_id=$(jq -r .run_id tools/tutorial/edit_inputs.json)" >> "$GITHUB_OUTPUT"
          echo "viewer=$(jq -r .viewer tools/tutorial/edit_inputs.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: tutorial-raw
          run-id: ${{ steps.in.outputs.run_id }}
          github-token: ${{ github.token }}
          path: raw
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q playwright huggingface_hub && python -m playwright install --with-deps chromium >/dev/null
      - name: Live copy
        env:
          HF_TOKEN: ${{ secrets.HF_HEADS_TOKEN }}
        run: python -c "from huggingface_hub import hf_hub_download as d; import os; print(d('juba-1/streamsafe-work','${{ steps.in.outputs.viewer }}',repo_type='dataset',token=os.environ['HF_TOKEN'],local_dir='live'))"
      - name: Edit
        run: python tools/tutorial/edit.py raw/screen.mp4 raw/actions.json live/${{ steps.in.outputs.viewer }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-final
          path: |
            out/StreamSafe_tutorial.mp4
            out/check_*.jpg
            out/c_*.png
