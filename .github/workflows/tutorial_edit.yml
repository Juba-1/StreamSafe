name: tutorial-edit

# A push to the tutorial-edit branch: edits the tutorial from the Windows recording committed on that branch
# (tutorial_raw/) and the live copy from the work store.
on:
  push:
    branches: [tutorial-edit]

permissions:
  contents: read
  actions: read

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q playwright huggingface_hub && python -m playwright install --with-deps chromium >/dev/null
      - name: Live copy
        env:
          HF_TOKEN: ${{ secrets.HF_HEADS_TOKEN }}
        run: python -c "from huggingface_hub import hf_hub_download as d; import os; print(d('juba-1/streamsafe-work','runs/demo_live_r1/viewer_view.mkv',repo_type='dataset',token=os.environ['HF_TOKEN'],local_dir='live'))"
      - name: Edit
        run: python tools/tutorial/edit.py tutorial_raw/screen.mp4 tutorial_raw/actions.json live/runs/demo_live_r1/viewer_view.mkv out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-final
          path: |
            out/StreamSafe_tutorial.mp4
            out/check_*.jpg
            out/c_*.png
