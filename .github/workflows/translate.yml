name: translate

# The Arabic translation feature with its REAL models (docs/TRANSLATE.md). The normal ci.yml runs the stub tests on every push;
# this builds the translation pack (OCR models + opus-mt-en-ar converted to CTranslate2), runs tests/test_translate_real.py
# on Linux and on Windows, measures what the feature costs, and keeps the sample picture and the numbers as artifacts.
on:
  push:
    branches: [translate]
  workflow_dispatch:
    inputs:
      publish:
        description: "upload the pack to the model store (only if it matches the app's sha256 pins)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[translate]" onnxruntime
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.57" sacremoses
      - name: build the pack (downloads the pinned sources, converts the translator, prints the table for release.py)
        run: python tools/build_translate_pack.py translate-pack | tee pack-table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: translate-pack
          path: |
            translate-pack
            pack-table.txt
          retention-days: 30

  real:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: "install (Linux, CPU onnxruntime)"
        if: runner.os == 'Linux'
        run: pip install -e ".[dev,translate]" onnxruntime onnx
      - name: "install (Windows, DirectML runtime)"
        if: runner.os == 'Windows'
        run: pip install -e ".[dev,translate]" onnxruntime-directml onnx
      - uses: actions/download-artifact@v4
        with:
          name: translate-pack
          path: artifact
      - name: real-model tests, cost numbers, sample picture
        shell: bash
        env:
          STREAMSAFE_TRANSLATE_PACK: ${{ github.workspace }}/artifact/translate-pack
          STREAMSAFE_TRANSLATE_REPORT: ${{ github.workspace }}/translate-report
        run: python -m pytest -q tests/test_translate_real.py -s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translate-report-${{ runner.os }}
          path: translate-report

  publish:
    # By hand only (Actions → translate → Run workflow, publish = true): puts the pack built above on the model store,
    # only if every file matches the sha256 the app pins (release.TRANSLATE_FILES) — a mismatch fails and uploads nothing.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: translate-pack
          path: artifact
      - run: pip install -e . huggingface_hub
      - name: verify against the app's pins
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          from streamsafe.app import release
          root = pathlib.Path("artifact/translate-pack")
          bad = []
          for name, (sha, _size) in release.TRANSLATE_FILES.items():
              p = root / name
              got = hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else "missing"
              if got != sha:
                  bad.append(f"{name}: {got}")
          print("\n".join(bad) or "all files match the pins")
          sys.exit(1 if bad else 0)
          PY
      - name: upload to the model store
        env:
          HF_TOKEN: ${{ secrets.HF_HEADS_TOKEN }}
        run: |
          python -c "from huggingface_hub import HfApi; HfApi().upload_folder(repo_id='juba-1/streamsafe-models', folder_path='artifact/translate-pack', path_in_repo='v1/translate', commit_message='translate pack')"
