name: zz-discovery
on:
  push:
    branches: [installer]
    paths: [".github/workflows/zz-discovery.yml"]
permissions:
  contents: read
jobs:
  look:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/BtbN/FFmpeg-Builds/releases?per_page=40" --jq '.[] | .tag_name + "  " + .published_at + "  assets=" + (.assets|length|tostring)'
          gh api "repos/BtbN/FFmpeg-Builds/releases?per_page=40" --jq '.[] | select(.tag_name|test("-(28|29|30|31)-")) | .tag_name as $t | .assets[] | select(.name|test("win64-lgpl-shared|linux64-lgpl-7|checksums")) | $t + "  " + .name + "  " + (.size|tostring) + "  " + (.digest // "")'
      - name: inno
        shell: pwsh
        run: |
          Get-Command iscc -ErrorAction SilentlyContinue
          Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\Languages" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          choco search innosetup --exact
      - name: tk arabic
        run: |
          pip install pillow
          python tools/ci_tk_arabic.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery
          path: out
