name: ci

# Every push: lint, the full test suite on Linux and on Windows, and a DirectML smoke test on Windows.
# The Windows runner has no GPU; DirectML runs on Microsoft's software adapter (correctness, not speed).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check . && ruff format --check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: "install (Linux, CPU onnxruntime)"
        if: runner.os == 'Linux'
        run: pip install -e ".[dev,translate]" onnxruntime onnx
      - name: "install (Windows, DirectML runtime)"
        if: runner.os == 'Windows'
        run: pip install -e ".[dev,translate]" onnxruntime-directml onnx
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: tests (Linux, all)
        if: runner.os == 'Linux'
        run: python -m pytest -q
      - name: tests (Windows; realtime-speed tests run on Linux only, the shared runner is too slow for them)
        if: runner.os == 'Windows'
        run: python -m pytest -q -k "not realtime"
      - name: DirectML smoke
        if: runner.os == 'Windows'
        run: python tools/ci_dml_smoke.py
      - name: system checker (report only; no GPU on CI)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python -m streamsafe.syscheck --json
