name: tutorial

# By hand: records the tutorial's screen part on a Windows runner (the real window, the real OBS, real mouse).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -q -e . pyautogui
          choco install obs-studio ffmpeg -y --no-progress | Out-Null
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "resolution: $_" }
      - name: Record
        shell: pwsh
        run: tools/tutorial/record.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-raw
          path: tutorial_out
