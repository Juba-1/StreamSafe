name: build-windows

# Builds the Windows beta folder (StreamSafe.exe + runtime, AMD/Intel/NVIDIA via DirectML). Models are not inside;
# the installer downloads them. Run by hand (Actions tab) or on a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: pip install -e . onnxruntime-directml "pyinstaller>=6.10"
      - name: "build (one folder, not one file: fewer antivirus false alarms and faster start)"
        run: >
          pyinstaller --noconfirm --clean --onedir --console --name StreamSafe
          --collect-submodules streamsafe --collect-binaries onnxruntime
          tools/win_entry.py
      - name: smoke
        shell: pwsh
        run: |
          dist/StreamSafe/StreamSafe.exe --help
          $out = dist/StreamSafe/StreamSafe.exe check --json | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -gt 2 -or -not ($out | ConvertFrom-Json).verdict) { exit 1 } else { exit 0 }
      - uses: actions/upload-artifact@v4
        with:
          name: StreamSafe-windows
          path: dist/StreamSafe
          retention-days: 14
